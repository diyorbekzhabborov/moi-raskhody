<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <g filter="url(#shadow)">
    <!-- Main wallet / card background -->
    <rect x="96" y="140" width="320" height="232" rx="36" fill="#ffffff" fill-opacity="0.1" stroke="rgba(255,255,255,0.2)" stroke-width="6"/>
    
    <!-- Accent wave / chart path -->
    <path d="M 120 280 Q 200 180 270 240 T 392 190" fill="none" stroke="url(#glowGrad)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Pulse dot -->
    <circle cx="392" cy="190" r="14" fill="#10b981"/>
    <circle cx="392" cy="190" r="24" fill="#10b981" fill-opacity="0.3"/>
    
    <!-- Somoni / Coin badge -->
    <circle cx="160" cy="200" r="28" fill="#38bdf8"/>
    <text x="160" y="210" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="900" fill="#0f172a" text-anchor="middle">S</text>
  </g>
</svg>
